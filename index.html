<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moldae Cerâmica | Moldes e Cortadores</title>
    <script src="https://cdn.tailwindcss.com/"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primario: '#d4a574',
                        secundario: '#8b5a2b',
                        fundo: '#f9f6f0',
                        texto: '#333333'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        :root {
            --cor-primario: #d4a574;
            --cor-secundario: #8b5a2b;
            --fonte: 'Inter', sans-serif;
        }
        * { font-family: var(--fonte); }
        .categoria-conteudo { display: none; }
        .categoria-conteudo.ativa { display: block; }
        .cartao-produto:hover { transform: translateY(-5px); transition: all 0.3s ease; }
        .bg-primario { background-color: var(--cor-primario); }
        .bg-primario-10 { background-color: rgba(212, 165, 116, 0.1); }
        .bg-secundario { background-color: var(--cor-secundario); }
        .text-secundario { color: var(--cor-secundario); }
        .border-secundario { border-color: var(--cor-secundario); }
    </style>
</head>
<body class="bg-fundo text-texto">

<!-- ==================================================
     ✅ PRODUTOS — EDITE AQUI DIRETO
     ================================================== -->
<script>
const DADOS_SITE = {
    credenciais: { usuario: 'Rhode', senha: 'Island' },
    config: {
        logoUrl: 'https://via.placeholder.com/150x80?text=MOLDAE',
        logoTamanho: 64,
        titulo: 'Moldes e Cortadores para Cerâmica',
        subtitulo: 'Produtos de qualidade para dar forma à sua arte',
        corPrimaria: '#d4a574',
        corSecundaria: '#8b5a2b'
    },
    produtos: [
        {
            id: 1,
            nome: 'Molde Manteigueira Francesa',
            descricao: 'Kit Molde para Manteigueira francesa. Acompanha: 2 peças: 1x Molde 1x Cortador',
            categoria: 'moldes',
            imagem: 'https://scontent-gru1-1.xx.fbcdn.net/v/t39.30808-6/825292619_10235672214690707_1594651004314722073_n.jpg?stp=dst-jpg_tt6&cstp=mx768x972&ctp=s768x972&_nc_cat=101&ccb=1-7&_nc_sid=aa7b47&_nc_eui2=AeFN9yQC8CMF_IZX0cjC3X9iINnZVx2fqGwg2dlXHZ-obNgjLnSv9-Oo0xdp3BHCC4Q&_nc_ohc=vZdNNrOp65MQ7kNvwEHIRvs&_nc_oc=AdoqCbvZRz2inqvPPqKOQsFoyG3MYDDGVw4YSl9kF6dKHrf8VFSnhbzWEo4XmJXk8bw&_nc_zt=23&_nc_ht=scontent-gru1-1.xx&_nc_gid=1oQqg6l9cLeUebGfwk-d-A&_nc_ss=7b2a8&oh=00_AQN3HLVbUP7uZFod875P-JZfreWiVReONLA4L1MyUVCb6A&oe=6AC58F67'
        },
        {
            id: 2,
            nome: 'Suporte para amostras de esmalte (Redondo)',
            descricao: 'Suporte para amostras de esmalte. (personalizável) Para disquinhos de até 55mm',
            categoria: 'ferramentas',
            imagem: 'https://scontent-gru2-2.xx.fbcdn.net/v/t39.30808-6/825353316_10235660281072374_1576819588531748826_n.jpg?stp=dst-jpg_tt6&cstp=mx1024x765&ctp=s1024x765&_nc_cat=102&ccb=1-7&_nc_sid=aa7b47&_nc_eui2=AeF4K4doXO2PccNKeso9kOmSQIw-OTIi7P9AjD45MiLs_xFqe8uHaM5YP2Kt4I6LRfs&_nc_ohc=ruph4FwrI1gQ7kNvwENjuC9&_nc_oc=AdpocXh27CU0AY2qBaRposmX9tuNDo68ZaaHz1KFhMWxBRpOXNqJNpWGkNbpA2CZoII&_nc_zt=23&_nc_ht=scontent-gru2-2.xx&_nc_gid=OhW3ZR4tBHFA7ICVSggwHw&_nc_ss=7b2a8&oh=00_AQM60qV0Ewc2TdXXoPn_Gi7mVanBvaG1QVtzeBHM0hIXaQ&oe=6AC5783C'
        }
    ],
    proximoId: 3
};
</script>
<!-- ==================================================
     ✅ FIM DOS PRODUTOS — Mande mais abaixo!
     ================================================== -->

    <div id="area-publica">
        <header class="bg-white shadow-md sticky top-0 z-50">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <img id="logo-site" src="https://via.placeholder.com/150x80?text=MOLDAE" alt="Logo" class="h-16 object-contain">
                <nav class="hidden md:flex gap-8 font-medium">
                    <button class="cat-botao ativa text-secundario border-b-2 border-secundario pb-1" data-cat="todos">Início</button>
                    <button class="cat-botao hover:text-secundario" data-cat="ferramentas">Ferramentas</button>
                    <button class="cat-botao hover:text-secundario" data-cat="moldes">Moldes</button>
                    <button class="cat-botao hover:text-secundario" data-cat="cortadores">Cortadores</button>
                    <button class="cat-botao hover:text-secundario" data-cat="conjuntos">Conjuntos</button>
                </nav>
                <button id="btn-login" class="text-gray-600 hover:text-secundario text-xl"><i class="fa fa-cog"></i></button>
            </div>
        </header>

        <section class="bg-primario-10 py-16 mb-8">
            <div class="container mx-auto px-4 text-center">
                <h1 id="banner-titulo" class="text-3xl font-bold text-secundario mb-4">Moldes e Cortadores para Cerâmica</h1>
                <p id="banner-subtitulo" class="text-lg mb-8 max-w-2xl mx-auto">Produtos de qualidade para dar forma à sua arte</p>
                <a href="https://instagram.com/moldae_ceramica" target="_blank" class="inline-flex items-center gap-2 bg-[#E4405F] text-white px-8 py-3 rounded-full font-medium hover:bg-opacity-90">
                    <i class="fa fa-instagram"></i> Peça pelo Instagram @moldae_ceramica
                </a>
            </div>
        </section>

        <main class="container mx-auto px-4 pb-16">
            <div class="categoria-conteudo ativa" id="cat-todos"><h2 class="text-2xl font-semibold mb-6">Todos os Produtos</h2><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="grade-todos"></div></div>
            <div class="categoria-conteudo" id="cat-ferramentas"><h2 class="text-2xl font-semibold mb-6">Ferramentas</h2><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="grade-ferramentas"></div></div>
            <div class="categoria-conteudo" id="cat-moldes"><h2 class="text-2xl font-semibold mb-6">Moldes</h2><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="grade-moldes"></div></div>
            <div class="categoria-conteudo" id="cat-cortadores"><h2 class="text-2xl font-semibold mb-6">Cortadores</h2><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="grade-cortadores"></div></div>
            <div class="categoria-conteudo" id="cat-conjuntos"><h2 class="text-2xl font-semibold mb-6">Conjuntos</h2><div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="grade-conjuntos"></div></div>
        </main>

        <footer class="bg-secundario text-white py-10">
            <div class="container mx-auto px-4 text-center">
                <a href="https://instagram.com/moldae_ceramica" target="_blank" class="inline-flex items-center gap-2 text-xl hover:opacity-90">
                    <i class="fa fa-instagram"></i> @moldae_ceramica
                </a>
                <p class="mt-6 text-sm opacity-70">© 2026 Moldae Cerâmica</p>
            </div>
        </footer>
    </div>

    <script>
let dados = DADOS_SITE;

function renderizar() {
    const grades = {
        todos: document.getElementById('grade-todos'),
        ferramentas: document.getElementById('grade-ferramentas'),
        moldes: document.getElementById('grade-moldes'),
        cortadores: document.getElementById('grade-cortadores'),
        conjuntos: document.getElementById('grade-conjuntos')
    };
    Object.values(grades).forEach(g => g.innerHTML = '');
    
    dados.produtos.forEach(p => {
        const card = `
        <div class="bg-white rounded-xl overflow-hidden shadow cartao-produto">
            <img src="${p.imagem}" alt="${p.nome}" class="w-full h-64 object-cover">
            <div class="p-4">
                <h3 class="font-semibold text-lg mb-2">${p.nome}</h3>
                <p class="text-gray-600 text-sm mb-4">${p.descricao}</p>
                <a href="https://instagram.com/moldae_ceramica" target="_blank" class="block w-full text-center bg-[#E4405F] text-white py-2 rounded-lg hover:bg-opacity-90">
                    <i class="fa fa-instagram"></i> Pedir no Instagram
                </a>
            </div>
        </div>`;
        grades.todos.innerHTML += card;
        if (grades[p.categoria]) grades[p.categoria].innerHTML += card;
    });
    Object.entries(grades).forEach(([cat, el]) => {
        if (!el.innerHTML) el.innerHTML = '<p class="col-span-full text-center text-gray-400 py-8">Nenhum produto nesta categoria ainda.</p>';
    });
}

function aplicarConfig() {
    document.documentElement.style.setProperty('--cor-primario', dados.config.corPrimaria);
    document.documentElement.style.setProperty('--cor-secundario', dados.config.corSecundaria);
    document.getElementById('logo-site').src = dados.config.logoUrl;
    document.getElementById('logo-site').style.height = dados.config.logoTamanho + 'px';
    document.getElementById('banner-titulo').textContent = dados.config.titulo;
    document.getElementById('banner-subtitulo').textContent = dados.config.subtitulo;
}

document.querySelectorAll('.cat-botao').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.cat-botao').forEach(b => b.classList.remove('ativa', 'text-secundario', 'border-b-2', 'border-secundario', 'pb-1'));
        btn.classList.add('ativa', 'text-secundario', 'border-b-2', 'border-secundario', 'pb-1');
        document.querySelectorAll('.categoria-conteudo').forEach(c => c.classList.remove('ativa'));
        document.getElementById('cat-' + btn.dataset.cat).classList.add('ativa');
    };
});

renderizar();
aplicarConfig();
</script>
</body>
</html>
