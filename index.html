                <a href="https://instagram.com/moldae_ceramica" target="_blank" class="inline-flex items-center gap-2 text-xl hover:opacity-90">
                    <i class="fa fa-instagram"></i> @moldae_ceramica
                </a>
                <p class="mt-6 text-sm opacity-70">© 2026 Moldae Cerâmica</p>
            </div>

    <script>
let dados = DADOS_SITE;

const btnMenuCelular = document.getElementById('btn-menu-celular');
const menuCelular = document.getElementById('menu-celular');
btnMenuCelular.onclick = () => {
    menuCelular.classList.toggle('aberto');
    const icone = btnMenuCelular.querySelector('i');
    icone.classList.toggle('fa-bars');
    icone.classList.toggle('fa-times');
};

function gerarCardProduto(p) {
    const temTamanhos = p.temTamanhos && p.tamanhos && p.tamanhos.length > 0;
    
    let htmlTamanhos = '';
    if (temTamanhos) {
        htmlTamanhos = `
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Escolha o tamanho:</label>
            <select class="w-full border border-gray-300 rounded-lg p-2 text-gray-700 bg-white tamanho-select" data-produto="${p.id}">
                <option value="">— Selecione —</option>
                ${p.tamanhos.map(t => `<option value="${t.codigo}">${t.nome}</option>`).join('')}
            </select>
        </div>
        <div class="mb-4 text-sm text-gray-500 tamanho-texto" id="tamanho-texto-${p.id}" style="display: none;">
            <strong>Escolhido:</strong> <span id="nome-tamanho-${p.id}"></span>
        </div>`;
    }

    return `
    <div class="bg-white rounded-xl overflow-hidden shadow cartao-produto">
        <img src="${p.imagem}" alt="${p.nome}" class="w-full h-64 object-cover">
        <div class="p-4">
            <h3 class="font-semibold text-lg mb-2">${p.nome}</h3>
            <p class="text-gray-600 text-sm mb-4 whitespace-pre-line">${p.descricao}</p>
            ${htmlTamanhos}
            <a href="https://instagram.com/moldae_ceramica" target="_blank" 
               class="block w-full text-center bg-[#E4405F] text-white py-2 rounded-lg hover:bg-opacity-90 link-pedir"
               data-produto="${p.id}">
                <i class="fa fa-instagram"></i> Pedir no Instagram
            </a>
        </div>
    </div>`;
}

function renderizar() {
    const grades = {
        todos: document.getElementById('grade-todos'),
        ferramentas: document.getElementById('grade-ferramentas'),
        moldes: document.getElementById('grade-moldes'),
        cortadores: document.getElementById('grade-cortadores'),
        conjuntos: document.getElementById('grade-conjuntos'),
        natal: document.getElementById('grade-natal'),
        joias: document.getElementById('grade-joias')
    };
    Object.values(grades).forEach(g => g.innerHTML = '');
    
    dados.produtos.forEach(p => {
        const card = gerarCardProduto(p);
        grades.todos.innerHTML += card;
        if (grades[p.categoria]) grades[p.categoria].innerHTML += card;
    });
    
    Object.entries(grades).forEach(([cat, el]) => {
        if (!el.innerHTML) el.innerHTML = '<p class="col-span-full text-center text-gray-400 py-8">Nenhum produto nesta categoria ainda.</p>';
    });

    document.querySelectorAll('.tamanho-select').forEach(select => {
        select.onchange = function() {
            const prodId = this.dataset.produto;
            const valor = this.value;
            const produto = dados.produtos.find(p => p.id == prodId);
            const linkEl = document.querySelector(`.link-pedir[data-produto="${prodId}"]`);
            const textoEl = document.getElementById(`tamanho-texto-${prodId}`);
            const nomeEl = document.getElementById(`nome-tamanho-${prodId}`);
            
            if (valor && produto) {
                const tamanho = produto.tamanhos.find(t => t.codigo === valor);
                if (tamanho) {
                    textoEl.style.display = 'block';
                    nomeEl.textContent = tamanho.nome;
                    const mensagem = `Olá! Quero pedir: ${produto.nome} — ${tamanho.nome}`;
                    linkEl.href = `https://instagram.com/moldae_ceramica?msg=${encodeURIComponent(mensagem)}`;
                }
            } else {
                textoEl.style.display = 'none';
                linkEl.href = `https://instagram.com/moldae_ceramica`;
            }
        };
    });
}

function aplicarConfig() {
    document.documentElement.style.setProperty('--cor-primario', dados.config.corPrimaria);
    document.documentElement.style.setProperty('--cor-secundario', dados.config.corSecundaria);
    document.getElementById('logo-site').src = dados.config.logoUrl;
    document.getElementById('logo-site').style.height = dados.config.logoTamanho + 'px';
    document.getElementById('banner-titulo').textContent = dados.config.titulo;
    document.getElementById('banner-subtitulo').textContent = dados.config.subtitulo;
}

document.querySelectorAll('.cat-botao').forEach(btn => {
    btn.onclick = () => {
        document.querySelectorAll('.cat-botao').forEach(b => {
            b.classList.remove('ativa', 'text-secundario', 'border-b-2', 'border-secundario', 'pb-1');
            if (b.closest('#menu-celular')) b.classList.add('text-gray-700');
        });
        btn.classList.add('ativa', 'text-secundario');
        if (!btn.closest('#menu-celular')) btn.classList.add('border-b-2', 'border-secundario', 'pb-1');
        document.querySelectorAll('.categoria-conteudo').forEach(c => c.classList.remove('ativa'));
        document.getElementById('cat-' + btn.dataset.cat).classList.add('ativa');
        
        if (menuCelular.classList.contains('aberto')) {
            menuCelular.classList.remove('aberto');
            const icone = btnMenuCelular.querySelector('i');
            icone.classList.remove('fa-times');
            icone.classList.add('fa-bars');
        }
    };
});

renderizar();
aplicarConfig();
</script>
